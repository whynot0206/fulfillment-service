global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: fulfillment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: fulfillment-microservices
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "host.docker.internal:18080"
          - "host.docker.internal:18081"
          - "host.docker.internal:18082"
          - "host.docker.internal:18083"
          - "host.docker.internal:18084"
