spring:
  application:
    name: inventory-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/fulfillment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:18082}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
