spring:
  application:
    name: inventory-service
  datasource:
    url: ${INVENTORY_DATASOURCE_URL:jdbc:mysql://localhost:3306/fulfillment_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${INVENTORY_DB_USERNAME:fulfillment_inventory_app}
    password: ${INVENTORY_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:18082}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
