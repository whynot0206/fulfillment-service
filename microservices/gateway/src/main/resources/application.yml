server:
  port: ${GATEWAY_PORT:18080}

spring:
  application:
    name: fulfillment-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      routes:
        - id: commerce-service
          uri: ${gateway.services.commerce-url:http://localhost:18084}
          predicates:
            - Path=/api/auth/**,/api/products/**,/api/cart/**,/api/checkout/**
        - id: order-service
          uri: ${gateway.services.order-url:http://localhost:18081}
          predicates:
            - Path=/api/orders/**
          filters:
            - SetRequestHeader=X-Internal-Service-Token, ${INTERNAL_SERVICE_TOKEN}
        - id: payment-service
          uri: ${gateway.services.payment-url:http://localhost:18083}
          predicates:
            - Path=/api/payments/**
        - id: inventory-service
          uri: ${gateway.services.inventory-url:http://localhost:18082}
          predicates:
            - Path=/api/inventory/**

gateway:
  services:
    commerce-url: ${COMMERCE_SERVICE_URL:http://localhost:18084}
    order-url: ${ORDER_SERVICE_URL:http://localhost:18081}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:18083}
    inventory-url: ${INVENTORY_SERVICE_URL:http://localhost:18082}
  auth:
    # 免登录路径。默认拒绝、白名单放行——反过来写（黑名单）的话，
    # 以后每加一个接口都要记得去补黑名单，漏一条就是越权。
    #
    # 逐条理由：
    #   /api/auth/**      登录注册本身不可能要求已登录
    #   /api/products/**  未登录也要能逛商品
    #   /api/inventory/** 只读库存查询，商品页要用
    #   /api/payments/callbacks/**  支付回调来自支付网关，不是浏览器，
    #                     它自带 HMAC 签名，由 payment-service 自己验
    #   /actuator/**      监控端点；生产环境应该换成只监听内网端口，
    #                     现在放在这里是因为 Prometheus 抓取走的是同一个端口
    anonymous-paths: >-
      /api/auth/**,
      /api/products/**,
      /api/inventory/**,
      /api/payments/callbacks/**,
      /actuator/**

# 与 commerce-service 的 auth.jwt.* 必须取同一个值，否则网关验不过自己签发的令牌。
# 没有默认值是故意的：宁可启动失败，也不要用内置弱密钥跑起来。
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:}
    issuer: ${AUTH_JWT_ISSUER:fulfillment-commerce}

management:
  metrics:
    tags:
      application: fulfillment-gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
