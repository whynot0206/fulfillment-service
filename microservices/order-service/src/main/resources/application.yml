server:
  port: ${ORDER_SERVICE_PORT:18081}

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DATASOURCE_URL:jdbc:mysql://localhost:3306/fulfillment_order?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${ORDER_DB_USERNAME:fulfillment_order_app}
    password: ${ORDER_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${ORDER_DB_POOL_SIZE:10}
      connection-timeout: 3000
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 1000
            readTimeout: 3000

inventory:
  service:
    url: ${INVENTORY_SERVICE_URL:http://localhost:18082}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN:}

management:
  metrics:
    tags:
      application: fulfillment-order
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.why.fulfillment.order: INFO
