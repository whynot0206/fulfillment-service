# 生产部署示例：静态文件 + /api 反向代理到 Gateway。
#
# 前端代码里写的是相对路径 /api/...，所以生产和开发唯一的区别就是
# 谁来做这层转发——开发是 Vite 的 proxy，生产是这里。前端代码不用改。

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 单页应用的刷新问题。
    #
    # 用户在 /orders/12345 按 F5，浏览器会向服务器要这个路径，而磁盘上只有
    # index.html，没有 orders 目录 —— 不加这一行就是 404。
    # try_files 的意思是：找得到就给静态文件，找不到就回 index.html，
    # 由前端路由自己去解析这个路径。
    #
    # 这是 history 模式的代价。改用 hash 模式（/#/orders/12345）就没有这个问题，
    # 因为 # 后面的部分根本不会发给服务器；代价是 URL 难看、服务端拿不到路径。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长期缓存；index.html 绝对不能缓存，
    # 否则用户会一直拿旧的 HTML，里面引用的还是上一版的 js 文件名。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass         http://gateway:18080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 不要在这里转发或伪造 X-User-Id。下游服务信任这个头，
        # 而它只应该由 Gateway 在验签之后自己写。这里多写一行就是一个越权漏洞。
    }
}
